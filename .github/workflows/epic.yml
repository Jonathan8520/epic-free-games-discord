name: Epic Free Games Bot

on:
  schedule:
    # Surprises (aucun horaire fixe) : toutes les 20 min, jamais a l'heure pile.
    # L'heure pile est le creneau le plus charge de GitHub : avec `0 * * * *`,
    # les runs etaient retardes ou supprimes (3 a 7 h entre deux runs constates).
    - cron: "8,28,48 * * * *"
    # Sortie hebdo : Epic bascule le jeudi a 11h heure de New York (17h a Paris).
    # Le fuseau suit les changements d'heure tout seul. Plusieurs declenchements :
    # si GitHub en saute un, un autre passe, et un run arrive avant 11h attend
    # la sortie au lieu de repartir (voir _wait_for_release dans main.py).
    - cron: "40,50,55 10 * * 4"
      timezone: "America/New_York"
    - cron: "3,10,20 11 * * 4"
      timezone: "America/New_York"
  workflow_dispatch:

# Un seul run a la fois : deux runs qui se chevauchent liraient le meme
# state.json et enverraient deux fois les memes notifs. Un run en attente de
# la sortie du jeudi garde la main, les suivants patientent derriere.
concurrency:
  group: epic-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # attente sortie PC (25) + bascule API (10) + giveaway mobile (15)
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get state.json from datas branch
        run: git checkout origin/datas -- state.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium ne sert qu'à l'auto-claim, abandonné (AUTO_CLAIM=false). Ne pas
      # l'installer évite d'appeler apt-get à chaque run : c'est l'étape qui
      # casserait au passage d'ubuntu-latest à une nouvelle version d'Ubuntu.
      - name: Cache Playwright browsers
        if: vars.AUTO_CLAIM == 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Playwright
        if: vars.AUTO_CLAIM == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit case)
        if: vars.AUTO_CLAIM == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run bot
        env:
          DISCORD_WEBHOOK       : ${{ secrets.DISCORD_WEBHOOK }}
          ALERT_WEBHOOK         : ${{ secrets.ALERT_WEBHOOK }}
          ROLE_ID               : ${{ secrets.ROLE_ID }}
          GITHUB_REPOSITORY     : ${{ github.repository }}
          AUTO_CLAIM            : ${{ vars.AUTO_CLAIM }}
          EPIC_STORAGE_STATE_B64: ${{ secrets.EPIC_STORAGE_STATE_B64 }}
          GH_PAT                : ${{ secrets.GH_PAT }}
        run: python main.py

      - name: Upload debug screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Push state.json to datas branch
        run: |
          cp state.json /tmp/state.json
          git checkout datas
          cp /tmp/state.json state.json
          git add state.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update state.json"
          git push origin datas
