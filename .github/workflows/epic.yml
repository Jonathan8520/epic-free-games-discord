name: Epic Free Games Bot

on:
  schedule:
    - cron: "0 * * * *"  # Toutes les heures (le scheduler Python filtre)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le scheduler et forcer la verification"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get state.json from datas branch
        run: git checkout origin/datas -- state.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium ne sert qu'à l'auto-claim, abandonné (AUTO_CLAIM=false). Ne pas
      # l'installer évite d'appeler apt-get à chaque run : c'est l'étape qui
      # casserait au passage d'ubuntu-latest à une nouvelle version d'Ubuntu.
      - name: Cache Playwright browsers
        if: vars.AUTO_CLAIM == 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Playwright
        if: vars.AUTO_CLAIM == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit case)
        if: vars.AUTO_CLAIM == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run bot
        env:
          DISCORD_WEBHOOK       : ${{ secrets.DISCORD_WEBHOOK }}
          ALERT_WEBHOOK         : ${{ secrets.ALERT_WEBHOOK }}
          ROLE_ID               : ${{ secrets.ROLE_ID }}
          GITHUB_REPOSITORY     : ${{ github.repository }}
          AUTO_CLAIM            : ${{ vars.AUTO_CLAIM }}
          EPIC_STORAGE_STATE_B64: ${{ secrets.EPIC_STORAGE_STATE_B64 }}
          GH_PAT                : ${{ secrets.GH_PAT }}
          FORCE_RUN             : ${{ inputs.force }}
        run: python main.py

      - name: Upload debug screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Push state.json to datas branch
        run: |
          cp state.json /tmp/state.json
          git checkout datas
          cp /tmp/state.json state.json
          git add state.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update state.json"
          git push origin datas
