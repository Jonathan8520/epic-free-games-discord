name: Test recap Discord

# Lance test_recap.py depuis Actions, seul endroit où le secret DISCORD_WEBHOOK
# est lisible (l'API GitHub ne permet pas de relire un secret, uniquement de
# l'écrire). Sert à valider que Discord accepte le bouton lien du récapitulatif.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Envoie le récap de test
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID        : ${{ secrets.ROLE_ID }}
        run: python test_recap.py --send
